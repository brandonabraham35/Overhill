<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { width: 80%; margin: 20px auto; border: 1px solid #ddd; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #004a99; padding-bottom: 10px; }
        .footer { font-size: 12px; color: #777; border-top: 1px solid #ddd; padding-top: 10px; margin-top: 20px; }
        .school-name { color: #004a99; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="school-name">Admin Notification</div>
        </div>
        <h3>New Website Activity</h3>
        <p><strong>Action:</strong> {{action}}</p>
        <p><strong>Details:</strong></p>
        <ul>
            {{details}}
        </ul>
        <p>Please log in to the admin panel to view full details.</p>
        <div class="footer">
            <p>Overhill Junior School Website System</p>
        </div>
    </div>
</body>
</html>
